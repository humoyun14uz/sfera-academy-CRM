services:
  postgres:
    image: postgres:16-alpine
    container_name: sfera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfera_user
      POSTGRES_PASSWORD: sfera_password
      POSTGRES_DB: sfera_academy_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfera_user -d sfera_academy_crm']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sfera-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

